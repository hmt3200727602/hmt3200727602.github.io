<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人作品集 - 联系我</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- 导航栏 -->
<header>
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">我的作品集</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="works.html">作品列表</a></li>
                <li><a href="contact.html">联系我</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- 主内容区 -->
<main class="container">
    <h1 class="section-title">联系我</h1>
    <div class="contact-container">
        <div class="contact-info">
            <h2>联系方式</h2>
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <div>
                    <h3>邮箱</h3>
                    <p>3200727602@qq.com</p>
                </div>
            </div>

            <div class="info-item">
                <i class="fas fa-phone"></i>
                <div>
                    <h3>电话</h3>
                    <p>15335192204</p>
                </div>
            </div>

            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <div>
                    <h3>地址</h3>
                    <p>江苏省南京市江宁区淳化街道南京工程学院</p>
                </div>
            </div>

            <div class="info-item">
                <i class="fas fa-clock"></i>
                <div>
                    <h3>工作时间</h3>
                    <p>周一至周五: 9:00 - 18:00</p>
                    <p>周末: 休息</p>
                </div>
            </div>
        </div>

        <div class="contact-form">
            <h2>发送消息</h2>
            <form>
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入您的邮箱" required>
                </div>

                <div class="form-group">
                    <label for="subject">主题</label>
                    <input type="text" id="subject" name="subject" placeholder="请输入消息主题" required>
                </div>

                <div class="form-group">
                    <label for="message">消息内容</label>
                    <textarea id="message" name="message" rows="6" placeholder="请输入您的消息内容" required></textarea>
                </div>

                <button type="submit" class="submit-btn">发送消息</button>
            </form>
        </div>
    </div>
</main>

<!-- 页脚 -->
<footer>
    <div class="container">
        <div class="footer-content">
            <ul class="social-links">
                <li><a href="#"><i class="fab fa-github"></i></a></li>
                <li><a href="#"><i class="fab fa-behance"></i></a></li>
                <li><a href="#"><i class="fab fa-dribbble"></i></a></li>
                <li><a href="#"><i class="fab fa-linkedin"></i></a></li>
            </ul>
            <p>&copy; 2026 我的个人作品集 | 版权所有</p>
        </div>
    </div>
</footer>
</body>
</html>
